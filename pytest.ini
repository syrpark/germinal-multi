[pytest]
testpaths = tests
# Each file is also runnable as a script, which is why its assertions go
# through a check() helper rather than bare asserts; the helper raises only
# when PYTEST_CURRENT_TEST is set. Nothing here needs a GPU, AF3, Protenix or
# PyRosetta -- the backends are swapped for recording fakes and conftest.py
# stubs PyRosetta when it is absent -- but the pinned JAX/Haiku stack must be
# installed, since four modules import it transitively at collection.
addopts = -q
